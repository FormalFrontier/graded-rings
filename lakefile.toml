name = "graded-rings"
version = "0.1.0"
lintDriver = "batteries/runLinter"
defaultTargets = ["GradedRings", "GradedRingsTests", "GradedRingsExamples"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "coherent-modules"
git = "https://github.com/FormalFrontier/coherent-modules.git"
rev = "2c91cdf0cbc6bdd1911bb1517ad7b68cde5a0f83"

[[lean_lib]]
name = "GradedRings"

[[lean_lib]]
name = "GradedRingsTests"
srcDir = "test"
roots = ["Axioms", "FiniteType", "HomogeneousLifts", "HomogeneousLocalizationMap", "HomogeneousPrime", "InterfaceClient", "Localization", "LocalizationInterface", "LocalizationRootInterface", "Noetherian", "PrimeInterface", "PrimeRootInterface", "Quotient", "QuotientInterface", "QuotientRootInterface", "RootClient", "Veronese", "VeroneseDegreeOne", "CoherentTailVeronese", "WeightedBlocks", "WeightedEvaluation", "WeightedBlockAdjoin", "FiniteVeronese", "WeightedVeroneseGenerators", "GradedRingsTests.SymmetricAlgebraSquareZero", "VeroneseFiniteType", "VeroneseFinite", "VeroneseResidue", "VeroneseResidueModule", "VeroneseZero", "GradedRingsTests.SymmetricAlgebraSquareZeroAugmentation", "GradedRingsTests.SymmetricAlgebraSquareZeroSpec", "GradedRingsTests.SymmetricAlgebraModules", "GradedRingsTests.HomogeneousLocalizationReduced", "GradedRingsTests.ReesAlgebra", "GradedRingsTests.ReesModule", "GradedRingsTests.PowerQuotientMultiplication", "GradedRingsTests.PrincipalAssociatedGradedNoetherian", "GradedRingsTests.PolynomialModulePi"]

[lean_lib.leanOptions]
weak.linter.privateModule = false

[[lean_lib]]
name = "GradedRingsExamples"
srcDir = "examples"
roots = ["QuotientLocalization", "FinitenessAndPrimes", "Symmetric", "Multiplicity", "GradedRingsExamples.FilteredAssociatedGradedAdic", "GradedRingsExamples.PolynomialModuleFiniteness"]
