name = "graded-rings"
version = "0.1.0"
defaultTargets = ["GradedRings", "GradedRingsTests", "GradedRingsExamples"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[lean_lib]]
name = "GradedRings"

[[lean_lib]]
name = "GradedRingsTests"
srcDir = "test"
roots = ["Axioms", "FiniteType", "HomogeneousLifts", "HomogeneousLocalizationMap", "HomogeneousPrime", "InterfaceClient", "Localization", "LocalizationInterface", "LocalizationRootInterface", "Noetherian", "PrimeInterface", "PrimeRootInterface", "Quotient", "QuotientInterface", "QuotientRootInterface", "RootClient", "Veronese", "VeroneseDegreeOne"]

[[lean_lib]]
name = "GradedRingsExamples"
srcDir = "examples"
roots = ["QuotientLocalization", "FinitenessAndPrimes", "Symmetric", "Multiplicity"]
