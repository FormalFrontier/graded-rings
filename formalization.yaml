version: "v0.4"

project:
  name: Graded Rings
  description: >-
    Graded quotients and localizations, degree-multiplying maps of homogeneous
    localizations, homogeneous component surjectivity and polynomial lifts,
    irrelevant-ideal finiteness, homogeneous prime correspondence,
    symmetric algebras, selected-component Veronese rings, coherent-tail
    equivalences of whole selected rings, positive-index degree-one generation
    under an old-ring generation hypothesis, weighted evaluation at arbitrary
    homogeneous elements over actual degree-zero coefficients, finite
    positive-weight blocks of finitely supported natural exponent vectors,
    positive-weight polynomial monomial-adjoin membership, prescribed-index
    weighted-polynomial generation with arbitrary weights and coefficients,
    finite type of every prescribed positive whole selected ring over its actual
    new zero component from arbitrary-weight homogeneous generators or native
    finite-type input, all-index equivalence of actual selected degree-zero
    rings and finite type of the zero-index external selected ring over its
    actual new degree-zero ring, finiteness of the canonical inclusion from
    every positive selected-component ring when the original ring is finite
    type over its whole degree-zero ring, positive-index residue projections
    linear over the whole external selected ring and their exact finite images,
    whole-Veronese convolution on shifted sums of entire old components,
    canonical coefficient evaluation, positive reduced-index projection-range
    equivalence and finite-module transport from the full old zero ring, and
    prime-multiplicity valuations with homogeneous polynomial applications.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

