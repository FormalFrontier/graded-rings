    relationship: background
    note: >-
      Pinned formal dependency supplying graded-algebra, localization,
      symmetric-algebra, ideal, multiplicity and valuation infrastructure.
      Dependency sources are not bundled in the library source tree.
  - title: "The Rising Sea: Foundations of Algebraic Geometry — §7.4.4, Exercise 7.4.F"
    authors:
      - Ravi Vakil
    type: book
    location: "October 21, 2025 draft, printed p. 215; coefficient conventions pp. 151–152"
    relationship: background
    note: >-
      Motivates the independent coherent-tail algebra of whole selected rings
      with actual degree-zero coefficients. This result neither proves a Proj
      conclusion nor establishes exercise correspondence or source coverage.
      No original source expression is redistributed here.
  - title: "The Rising Sea: Foundations of Algebraic Geometry — §7.4.4, Exercise 7.4.G"
    authors:
      - Ravi Vakil
    type: book
    location: "October 21, 2025 draft, original printed/physical PDF p. 215; continuation p. 216; grading conventions pp. 151–152"
    relationship: background
    note: >-
      Background for the independently reusable arithmetic decomposition of
      finite positive-weight exponent vectors. The explicit block bound is
      not generally minimal, and this API does not establish finite-Veronese
      generation, polynomial factorization, Proj or source correspondence.
      The mathematical exposition and original Lean proofs are project
      contributions; no original source expression is redistributed here.

  - title: "The Rising Sea: Foundations of Algebraic Geometry — §7.4.4, Exercise 7.4.H"
    authors:
      - Ravi Vakil
    type: book
    location: "October 21, 2025 draft, printed/physical PDF pp. 215–216; grading conventions pp. 151–152"
    relationship: background
    note: >-
      Mathematical background for an independent finite weighted-polynomial
      generator lemma at every prescribed positive index. This lemma covers
      selected weighted degrees over arbitrary commutative semirings, with
      finite variables and arbitrary natural weights including zero. It does
      not establish finite type of the whole selected graded ring, the
      irrelevant-ideal conclusion of the exercise, source correspondence or
      book coverage. No original source expression is redistributed here.

status:
  scope: >-
    Twenty-four production leaves, an aggregate native module, twenty-nine registered
    regression-test modules and four standalone example modules. Quotient and localization
    constructions include degenerate commutative rings; degree-multiplying maps
    require an explicit natural-degree compatibility witness and mapped
    denominators, not a domain or regularity assumption. Valuation applications
    use their stated domain, divisibility, field and degree hypotheses.
    The selected-component Veronese ring and its internal grading exist for any
    natural index; whole-ring injective inclusion and the original zeroRingEquiv
    API require a positive index. The full actual new degree-zero component is
    equivalent to the old degree-zero ring at every index. At index zero the
    external summands remain distinct new degrees; monomial factorization over
    the entire actual new zero ring gives surjective polynomial evaluation and
    finite type of the whole external ring without old-ring finiteness, domain,
    field, Noetherianity or Nontrivial assumptions. Only the distinct-copy
    lemma assumes Nontrivial; no full polynomial equivalence or injectivity
    of whole-ring inclusion at zero is asserted. Ambient-surjective graded
    semiring maps are surjective
    on each whole component; homogeneous polynomial lifts in arbitrary
    nonnegative graded commutative rings use actual degree-zero coefficients,
    every degree-one element as a variable, and exactly the degree-one
    algebra-generation premise. Degree zero is included, without finite
    generation, domain, reducedness, nontriviality or field assumptions.
    For positive n, the whole selected ring is generated over its actual
    degree-zero component by all of its degree-one component when the old ring
    is generated over its actual degree-zero component by all of degree one.
    This needs no finite variables, finite type, domain, reducedness, field or
    nontriviality hypothesis; nothing is claimed for n = 0. A coherent positive
    tail with actual degree-zero ring equivalence and compatible high additive
    equivalences, coefficient multiplication and high products gives an
    equivalence of entire selected rings at N ≤ n, with two graded inverse
    laws and, for 0 < n, the degree-zero ring-hom square; no map on missing
    low degrees or extra domain/nontriviality hypothesis is required. No coefficient
    regrouping, chart/Proj or scheme equivalence is supplied here.
    Independently, for finite indices with strictly positive natural weights,
    an explicit positive (not generally minimal) size D gives an exact
    k-block decomposition of any finitely supported natural vector of weight
    k * D, preserving the entire vector. This arithmetic API does not prove
    finite-Veronese generation or polynomial factorization. For finite indices,
    strictly positive natural weights and any commutative semiring, every
    weighted-homogeneous polynomial of degree k * D belongs to the coefficient
    subalgebra generated by coefficient-one monomials of weight D. Arbitrary
    coefficients and k = 0 are included; whole-Veronese generation and zero
    weights are not claimed for that positive-weight API. In contrast, one
    finite weighted-homogeneous polynomial family generates every degree
    n * j over the entire coefficient semiring for each prescribed positive
    n, finite variables and arbitrary natural weights including zero. This
    polynomial result does not prove finite type of a whole selected graded
    ring, an n = 0 case or degree-one generation. Separately, ordinary
    polynomial evaluation at an arbitrary chosen homogeneous family of natural
    weights (including zero) preserves weighted degree and commutes with the
    target's actual graded-component decomposition, with coefficients in the
    actual degree-zero ring. Only the weighted homogeneous-lift theorem assumes
    that this chosen family generates the ring over degree zero; the first
    three declarations need no generation, finite-variable, domain, field or
    nontriviality assumption. For a finite positive-weight homogeneous
    generating family over the actual old degree-zero component, a positive
    selected ring is generated over its own degree zero by a finite subset
    of its entire new degree one. Native finite type over the old degree zero
    produces such a family and some positive selected index. Neither result
    requires a field, domain, Nontrivial, Noetherianity or equal weights, nor
    gives an all-indices or Proj conclusion. No complete-source
    or release-acceptance claim follows from this metadata. Separately, finite
    homogeneous generators of arbitrary natural weights, including zero,
    over the entire old degree-zero ring imply finite type of the whole
    selected ring at every independently prescribed positive index over its
    entire actual new zero component. Native finite type over the old degree-zero
    component supplies such generators. No field, domain, Nontrivial,
    Noetherianity, positive-weight or equal-weight assumption is needed;
    neither index zero nor new degree-one generation at every index follows.
    Separately, for each positive index the canonical selected-ring inclusion
    is finite when the original commutative ring is finite type over its entire
    old degree-zero ring. This is module finiteness of the old ring through
    the actual inclusion, not finite type of the selected ring over its new
    zero ring or an index-zero result. For each positive n and r < n, the
    residue projection onto old-degree components congruent to r is linear
    under that very same whole selected-ring inclusion action; its range
    consists exactly of elements whose other residue components vanish.
    Its image is finite if the old ring is finite over the selected ring,
    especially under native finite type over the entire old zero component
    by the finite-inclusion result. Separately, the shifted external sum of
    complete old-degree components carries convolution by the whole external
    selected ring, and coefficient evaluation into the old ring is linear for
    that same inclusion.toAlgebra action. Evaluation is injective for positive
    n; when also r < n it identifies the projection range by a linear
    equivalence. The shifted module is finite if the old ring is finite as a
    module for that action, in particular under finite type over the full old
    degree-zero ring. No whole-ring action on an individual old component,
    n = 0 evaluation bijection, unrestricted r >= n image equality or
    arbitrary-submodule finite-generation claim is made.
