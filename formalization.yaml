version: "v0.4"

project:
  name: Graded Rings
  description: >-
    Graded quotients and localizations, degree-multiplying maps of homogeneous
    localizations, homogeneous component surjectivity and polynomial lifts,
    irrelevant-ideal finiteness, homogeneous prime correspondence,
    symmetric algebras, selected-component Veronese rings, coherent-tail
    equivalences of whole selected rings, positive-index degree-one generation
    under an old-ring generation hypothesis, and
    prime-multiplicity valuations with homogeneous polynomial applications.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - Ravi Vakil
    type: book
    location: "October 21, 2025 draft, exercises 4.5.F–H, 5.4.N and §7.4.4/7.4.D–E (printed p. 215)"
    relationship: background
    note: >-
      Mathematical motivation for reusable constructions, including the
      selected-component Veronese ring in §7.4.4, Exercise 7.4.D, and
      the old-degree homogeneous polynomial-lift prerequisite and algebraic
      positive-Veronese degree-one generation motivated by Exercise 7.4.E,
      under 0 < n and generation of the old ring over its actual degree-zero
      component by its entire degree-one component. It does not establish
      coefficient regrouping, chart/Proj invariance or source correspondence.
      Neither complete source coverage nor redistribution of the source text is asserted.
      The generic Lean expression was developed as an original project contribution.
  - title: "mathlib"
    authors:
      - The mathlib contributors
    type: formalization
    id: "leanprover-community/mathlib4@83abb3e776bdefcbc447a1e44d0debe4010039e5"
    relationship: background
    note: >-
      Pinned formal dependency supplying graded-algebra, localization,
      symmetric-algebra, ideal, multiplicity and valuation infrastructure.
      Dependency sources are not bundled in the library source tree.
  - title: "The Rising Sea: Foundations of Algebraic Geometry — §7.4.4, Exercise 7.4.F"
    authors:
      - Ravi Vakil
    type: book
    location: "October 21, 2025 draft, printed p. 215; coefficient conventions pp. 151–152"
    relationship: background
    note: >-
      Motivates the independent coherent-tail algebra of whole selected rings
      with actual degree-zero coefficients. This result neither proves a Proj
      conclusion nor establishes exercise correspondence or source coverage.
      No original source expression is redistributed here.

status:
  scope: >-
    Fourteen production leaves, an aggregate native module, nineteen private regression
    clients and four standalone example modules. Quotient and localization
    constructions include degenerate commutative rings; degree-multiplying maps
    require an explicit natural-degree compatibility witness and mapped
    denominators, not a domain or regularity assumption. Valuation applications
    use their stated domain, divisibility, field and degree hypotheses.
    The selected-component Veronese ring and its internal grading exist for any
    natural index; injective inclusion and the degree-zero equivalence require
    a positive index. Ambient-surjective graded semiring maps are surjective
    on each whole component; homogeneous polynomial lifts in arbitrary
    nonnegative graded commutative rings use actual degree-zero coefficients,
    every degree-one element as a variable, and exactly the degree-one
    algebra-generation premise. Degree zero is included, without finite
    generation, domain, reducedness, nontriviality or field assumptions.
    For positive n, the whole selected ring is generated over its actual
    degree-zero component by all of its degree-one component when the old ring
    is generated over its actual degree-zero component by all of degree one.
    This needs no finite variables, finite type, domain, reducedness, field or
    nontriviality hypothesis; nothing is claimed for n = 0. A coherent positive
    tail with actual degree-zero ring equivalence and compatible high additive
    equivalences, coefficient multiplication and high products gives an
    equivalence of entire selected rings at N ≤ n, with two graded inverse
    laws and, for 0 < n, the degree-zero ring-hom square; no map on missing
    low degrees or extra domain/nontriviality hypothesis is required. No coefficient
    regrouping, chart/Proj or scheme equivalence is supplied here.
    No complete-source or release-acceptance claim follows from this metadata.
