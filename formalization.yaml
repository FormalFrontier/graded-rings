  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - Ravi Vakil
    type: book
    location: "October 21, 2025 draft, exercises 4.5.F–H, 5.4.N and §7.4.4/7.4.D–E (printed p. 215)"
    relationship: background
    note: >-
      Mathematical motivation for reusable constructions, including the
      selected-component Veronese ring in §7.4.4, Exercise 7.4.D, and
      the old-degree homogeneous polynomial-lift prerequisite and algebraic
      positive-Veronese degree-one generation motivated by Exercise 7.4.E,
      under 0 < n and generation of the old ring over its actual degree-zero
      component by its entire degree-one component. It does not establish
      coefficient regrouping, chart/Proj invariance or source correspondence.
      Neither complete source coverage nor redistribution of the source text is asserted.
      The generic Lean expression was developed as an original project contribution.
  - title: "mathlib"
