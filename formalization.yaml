acknowledgements: >-
  Atlas authored the original mathematical units, quotient repair,
  remaining native assembly and reader examples. Three Worker A Tasks
  contributed compatibility, native interfaces and localization repair;
  Worker B supplied a bounded origin inventory. Exact revisions and Task
  identities are preserved in docs/PROVENANCE.md. Lean and the mathlib
  contributors supplied the formal foundations and reusable APIs.
  A separate Worker A Task supplied the degree-multiplying localization producer
  and client in the incubator; another Worker A Task adapted them for this
  library. Exact Task identities and revisions are in docs/PROVENANCE.md.
  A separate Worker B Task wrote the selected-component Veronese ring and
  algebra-only examples in the incubator; a later Worker B Task transferred
  them into this library without changing the mathematical proof expressions.
  Their distinct identities and exact source are in docs/PROVENANCE.md.
  Another Worker B Task wrote the homogeneous-lifts producer and client in the
  incubator; a distinct Worker B Task transferred its producer byte-for-byte,
  adapted the direct client, and added destination wiring, prose and metadata.
  Both actual Task identities and the isolated review are in docs/PROVENANCE.md.
  A later Worker B Task independently wrote the positive-Veronese degree-one
  generation proof and clients in an isolated incubator branch. Atlas corrected
  its guide, and a distinct Worker B Task transferred the producer byte-for-byte,
  adapted its client and wrote destination wiring, guide and metadata. The
  source-plan, original review, guide review and distinct Task identities are
  recorded in docs/PROVENANCE.md; destination acceptance is a separate recorded decision.
  Atlas adapted the native Markdown renderer from the earlier project recipes,
  including Anchor's original ideal-completion recipe; docs/README.md records
  that lineage. Prior artifact approval is not transferred.
  A further Worker B Task authored the original coherent-tail proofs and clients
  in an isolated incubator branch; a fresh Worker A Task independently reviewed
  that algebra, and a distinct Worker B Task transferred the original bodies
  and added root use, standalone guide, wiring and metadata here. Their exact
  names, UIDs and frozen revisions are in docs/PROVENANCE.md. The original
  source review is separate from destination review and source correspondence.
  A separate Worker A Task authored the positive-weight arithmetic exposition;
  a Worker B Task independently authored the incubator producer and ordinary
  client, and a fresh Worker A Task reviewed that isolated source. A distinct
  Worker B Task transferred the original proof bodies and adapted native
  imports, clients, documentation, root witness and metadata for this library.
  Exact names, UIDs and revisions are in docs/PROVENANCE.md. Original source
  review is not acceptance or verification of this destination graph.
  An earlier Worker A Task authored the source Exercise 7.4.G exposition,
  Atlas designed the weighted-evaluation interface in uncompiled source notes,
  and a separate Worker B Task authored the complete isolated producer and
  direct client proofs. A Worker A Task independently reviewed the isolated
  mathematical, API, evidence and rights candidate; another Worker B Task
  transferred the unchanged producer bodies, adapted direct import and added
  destination root witness, standalone guide, wiring and metadata. Exact
  author, reviewer, designer and transfer Task names, UIDs and revisions are
  recorded in docs/PROVENANCE.md. Original source review and checks are not
  changed-destination acceptance, release or source correspondence.
  A separate Worker B Task authored the original weighted-polynomial adjoin
  producer, client and guide in the incubator; another Worker B Task removed
  unsupported ownership labels without changing proofs, and a fresh Worker A
  Task reviewed the correction. A distinct Worker B Task transferred those
  proofs, adapted native imports, clients, documentation, root witness and
  metadata here. The original objection and repaired exact-review histories,
  all contributor Task names/UIDs and frozen inputs remain in docs/PROVENANCE.md;
  isolated acceptance does not certify the changed destination graph.
  A further Worker B Task wrote the original finite-Veronese generation
  proof and direct client in an isolated incubator candidate using accepted
  evaluation and repaired weighted-adjoin prerequisites. A fresh Worker A
  Task independently reviewed that exact mathematical, client, rights and
  original evidence candidate; a distinct Worker B Task transferred the
  unchanged mathematical proofs into native destination imports and supplied
  an ordinary client, aggregate witness, guide, wiring and metadata here.
  Original, prerequisite, repair, exposition, reviewer and transfer Task
  identities and exact donor/review references are in docs/PROVENANCE.md.
  Accepted isolated research is not destination verification or source coverage.
  A separate Worker B Task authored the prescribed-index finite weighted-polynomial
  generator theorem and its ordinary client in an isolated incubator candidate;
  a fresh Worker A Task reviewed that exact candidate. A distinct Worker B Task
  transferred the unchanged mathematical producer, adapted the direct client
  import, and supplied a generic aggregate witness, guide, wiring and metadata.
  Their exact identities, original evidence and review references are recorded
