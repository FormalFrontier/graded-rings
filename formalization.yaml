automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier agents using Lean, Lake, pinned mathlib and
        independent review of exact revisions.
  notes: >-
    AI agents authored mathematical constructions, proofs, interfaces,
    examples and documentation. Model identities and resource usage are
    not inferred from Git authorship.

review:
  status: "Independently reviewed mathematical library"
  notes: >-
    The completed mathematical contributions have their revision-specific
    independent reviews, applicable build and complete transitive standard-axiom
    evidence and official publication recorded in the owning project records.
    The current hand-maintained API map is not a declaration census, and the
    historical native snapshot is not a proof certificate for this expanded
    library. Metadata does not itself certify a later candidate, copyright
    clearance or any source-specific exercise correspondence and coverage.

acknowledgements: >-
  Atlas contributed the original mathematical units, assembly and several
  design assessments; other Formal Frontier agents contributed original Lean
  mathematics, direct clients, adaptations, repair, review, guides and examples.
  Atlas's zero-index and weighted-evaluation designs did not originate the later
  Lean proof bodies. The original formalization authors and separate adaptation
  contributors are credited as Formal Frontier Agents; Anchor contributed the
  earlier API-rendering recipe. Jujian Zhang and Eric Wieser's authentic mathlib
  localization notices are preserved in the adapted producer; Lean and mathlib
  contributors retain credit for foundational dependencies. Further contributor,
  adaptation and mathematical-source context is in docs/PROVENANCE.md.
