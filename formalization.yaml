version: "v0.4"

project:
  name: Graded Rings
  description: >-
    Graded quotients and localizations, degree-multiplying maps of homogeneous
    localizations, homogeneous component surjectivity and polynomial lifts,
    irrelevant-ideal finiteness, homogeneous prime correspondence,
    symmetric algebras, selected-component Veronese rings, and
    prime-multiplicity valuations with homogeneous polynomial applications.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - Ravi Vakil
    type: book
    location: "October 21, 2025 draft, exercises 4.5.F–H, 5.4.N and §7.4.4/7.4.D–E (printed p. 215)"
    relationship: background
    note: >-
      Mathematical motivation for reusable constructions, including the
      selected-component Veronese ring in §7.4.4, Exercise 7.4.D, and
      the old-degree homogeneous polynomial-lift prerequisite to Exercise 7.4.E.
      This library does not establish positive-Veronese degree-one generation,
      coefficient regrouping or Proj invariance.
      Neither complete source coverage nor redistribution of the source text is asserted.
      The generic Lean expression was separately developed in this library.
  - title: "mathlib"
    authors:
      - The mathlib contributors
    type: formalization
    id: "leanprover-community/mathlib4@83abb3e776bdefcbc447a1e44d0debe4010039e5"
    relationship: background
    note: >-
      Pinned formal dependency supplying graded-algebra, localization,
      symmetric-algebra, ideal, multiplicity and valuation infrastructure.
      Dependency sources are not bundled in the library source tree.

status:
  scope: >-
    Twelve production leaves, an aggregate native module, seventeen private regression
    clients and four standalone example modules. Quotient and localization
    constructions include degenerate commutative rings; degree-multiplying maps
    require an explicit natural-degree compatibility witness and mapped
    denominators, not a domain or regularity assumption. Valuation applications
    use their stated domain, divisibility, field and degree hypotheses.
    The selected-component Veronese ring and its internal grading exist for any
    natural index; injective inclusion and the degree-zero equivalence require
    a positive index. Ambient-surjective graded semiring maps are surjective
    on each whole component; homogeneous polynomial lifts in arbitrary
    nonnegative graded commutative rings use actual degree-zero coefficients,
    every degree-one element as a variable, and exactly the degree-one
    algebra-generation premise. Degree zero is included, without finite
    generation, domain, reducedness, nontriviality or field assumptions.
    No positive-Veronese generation, chart or scheme equivalence is supplied here.
    No complete-source or release-acceptance claim follows from this metadata.
  main_results:
    - declaration: Ideal.Quotient.gradedRing
      file: GradedRings/Quotient.lean
    - declaration: GradedLocalization.gradedRing
      file: GradedRings/Localization.lean
    - declaration: HomogeneousLocalization.mapDegreeMul
      file: GradedRings/HomogeneousLocalizationMap.lean
    - declaration: GradedAlgebra.irrelevant_fg_iff_finiteType
      file: GradedRings/FiniteType.lean
    - declaration: GradedAlgebra.isNoetherianRing_iff_gradeZero_and_irrelevant_fg
      file: GradedRings/Noetherian.lean
    - declaration: GradedRing.homogeneousPrimeEquivDegreeZeroPrime
      file: GradedRings/HomogeneousPrime.lean
    - declaration: SymmetricAlgebra.gradedAlgebra
      file: GradedRings/SymmetricAlgebra.lean
    - declaration: PrimeMultiplicity.localizationValuation
      file: GradedRings/PrimeMultiplicity.lean
    - declaration: HomogeneousLocalization.awayPrimeMultiplicityValuation
      file: GradedRings/HomogeneousPrimeMultiplicity.lean
    - declaration: MvPolynomial.irreducible_of_awayPrimeMultiplicityValuation_eq_exp_one
      file: GradedRings/MvPolynomialAway.lean
    - declaration: GradedRing.Veronese.VeroneseRing
      file: GradedRings/Veronese.lean
    - declaration: GradedRing.Veronese.inclusion
